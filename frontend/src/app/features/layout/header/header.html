<header class="shell-header glass-effect">
    <div class="header-title">
        <h2>Agentic Admin</h2>
        <span class="subtitle">Workspace management</span>
    </div>

    <div class="header-actions">
        <div class="user-profile">
            <div class="user-avatar">
                {{ avatarLetter() }}
            </div>
            <div class="user-info">
                <span class="user-name">{{ currentUserProfile()?.fullName || authStore.user()?.email }}</span>
                <span class="subtitle">{{ currentUserProfile()?.email }}</span>
            </div>
        </div>

        <button
            class="transparent-btn icon-only"
            type="button"
            (click)="themeService.toggle()"
            [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
            <span class="ph" [class.ph-moon]="themeService.isDark()" [class.ph-sun]="!themeService.isDark()"></span>
        </button>
    </div>
</header>
