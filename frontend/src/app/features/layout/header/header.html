<header class="shell-header glass-effect">
    <div class="header-title">
        <h2>Agentic Admin</h2>
        <span class="subtitle">Workspace management</span>
    </div>

    <div class="header-actions">
        <button type="button" class="user-avatar user-menu-trigger" (click)="toggleMenu($event)" aria-haspopup="menu" aria-label="תפריט משתמש">
            <span>{{ avatarLetter() }}</span>
        </button>
        <p-tiered-menu #userMenu [model]="menuItems()" [popup]="true" />
    </div>
</header>
