<aside class="sidebar glass-effect" [class.collapsed]="collapsed()">
    <div class="sidebar-header">
        <img src="logo/agentic-admin-logo.png" alt="Agentic Admin" class="logo" />
    </div>

    <nav class="nav-list">
        <button routerLink="/dashboard" routerLinkActive="active" class="nav-item"
            appTooltip [text]="collapsed() ? 'לוח בקרה' : ''">
            <span class="ph ph-squares-four nav-icon"></span>
            <span class="nav-label">לוח בקרה</span>
        </button>
        <button routerLink="/users" routerLinkActive="active" class="nav-item"
            appTooltip [text]="collapsed() ? 'ניהול משתמשים' : ''">
            <span class="ph ph-users nav-icon"></span>
            <span class="nav-label">ניהול משתמשים</span>
        </button>

        <button routerLink="/strain-hunter" routerLinkActive="active" class="nav-item"
            appTooltip [text]="collapsed() ? 'Strain Hunter' : ''">
            <span class="ph ph-compass nav-icon"></span>
            <span class="nav-label">Strain Hunter</span>
        </button>

        <button routerLink="/settings" routerLinkActive="active" class="nav-item"
            appTooltip [text]="collapsed() ? 'הגדרות' : ''">
            <span class="ph ph-gear nav-icon"></span>
            <span class="nav-label">הגדרות</span>
        </button>

        <button routerLink="/media" routerLinkActive="active" class="nav-item"
            appTooltip [text]="collapsed() ? 'סטודיו מדיה' : ''">
            <span class="ph ph-images nav-icon"></span>
            <span class="nav-label">סטודיו מדיה</span>
        </button>

        <button routerLink="/ideas" routerLinkActive="active" class="nav-item"
            appTooltip [text]="collapsed() ? 'מחולל רעיונות' : ''">
            <span class="ph ph-lightbulb nav-icon"></span>
            <span class="nav-label">מחולל רעיונות</span>
        </button>

        <div class="nav-item-chat">
            <button routerLink="/chat" routerLinkActive="active" class="nav-item"
                appTooltip [text]="collapsed() ? 'צʼאט' : ''">
                <span class="ph ph-chat-circle-text nav-icon"></span>
                <span class="nav-label">צ'אט</span>
            </button>
            @if (chatStore.recentSessions().length > 0) {
                <app-dropdown #chatDropdown [position]="'bottom-right'">
                    <button
                        button
                        class="transparent-btn icon-only sm"
                        type="button"
                        (click)="navigateTo(); chatDropdown.hideDropdown(); $event.stopPropagation()"
                        appTooltip
                        text="היסטוריית שיחות"
                    >
                        <span class="ph ph-feather"></span>
                    </button>
                    <div content class="fade-in">
                        <div class="nav-sub-list">
                            @for (session of formattedSessions(); track session.id) {
                                <div class="nav-sub-item stagger stagger-up" [class.active]="chatStore.currentSessionId() === session.id">
                                    @if (pendingDeleteSessionId() === session.id) {
                                        <div class="delete-confirmation">
                                            <span class="warning-text">
                                                <span class="ph ph-warning-circle"></span>
                                                <span class="typewriter">האם אתה בטוח?</span>
                                            </span>
                                            <div class="action-btns">
                                                <button class="icon-only transparent-btn sm" type="button" (click)="cancelDelete()">
                                                    <span class="ph ph-x"></span>
                                                </button>
                                                <button class="icon-only danger-btn sm" type="button" (click)="confirmDelete()">
                                                    <span class="ph ph-check"></span>
                                                </button>
                                            </div>
                                        </div>
                                    } @else {
                                        <button
                                            class="nav-item sm"
                                            type="button"
                                            (click)="navigateTo(session.id); chatDropdown.hideDropdown()"
                                        >
                                            <span class="ph ph-chat-centered-text"></span>
                                            <span class="nav-label session-title-label">{{ session.title }}</span>
                                        </button>
                                        <button
                                            class="icon-only sm hover-reveal-btn"
                                            type="button"
                                            (click)="setPendingDelete($event, session.id)"
                                        >
                                            <span class="ph ph-trash"></span>
                                        </button>
                                    }
                                </div>
                            }
                        </div>
                    </div>
                </app-dropdown>
            }
        </div>
    </nav>

    <div class="sidebar-footer">
        <button (click)="toggleSidebar()" class="nav-item toggle-btn"
            appTooltip [text]="collapsed() ? 'הרחב תפריט' : 'כווץ תפריט'">
            <span class="ph ph-caret-left toggle-icon nav-icon"></span>
            <span class="nav-label">{{ collapsed() ? 'הרחב' : 'כווץ' }}</span>
        </button>
        <button (click)="authStore.logout()" class="nav-item"
            appTooltip [text]="collapsed() ? 'יציאה' : ''">
            <span class="ph ph-sign-out nav-icon"></span>
            <span class="nav-label">יציאה</span>
        </button>
    </div>
</aside>
