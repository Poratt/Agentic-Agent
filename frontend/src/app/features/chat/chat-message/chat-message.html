<div
    class="chat-message-row"
    [ngClass]="{
        'user-message': isUser(),
        'assistant-message': isAssistant(),
        'typing-active': showCursor(),
        'bubble-enter': isActiveStream(),
    }"
>
    <!-- <div class="message-meta">
        <span class="ph role-icon" [class.ph-user]="isUser()" [class.ph-robot]="!isUser()"></span>
        <strong>{{ roleLabel() }}</strong>
    </div> -->

    @if (isThinkingVisible()) {
        <details
            class="thinking-process-box"
            [class.collapsing-out]="rowState() === 'transitioning'"
            [open]="true"
            (transitionend)="onThinkingTransitionEnd($event)"
        >
            <summary class="thinking-summary">
                <span class="ph summary-icon ph-brain" [class.thinking]="rowState() === 'thinking'"></span>
                <span class="summary-label">פעולות שבוצעו...</span>
                <span class="ph ph-caret-down expand-icon"></span>
            </summary>
            <ul class="steps-list" [autoScrollBottom]="true">
                @for (step of displaySteps(); track $index) {
                    <li class="step-item">
                        <span class="xs ph {{ step.icon }}"></span>
                        <span class="step-text">{{ step.message }}</span>
                        @if (step.statusIcon) {
                            <span class="ph {{ step.statusIcon }} step-status-icon"></span>
                        }
                    </li>
                }
            </ul>
        </details>
    }

    <div class="message-body" [aiFormat]="contentForDisplay()"></div>
</div>
