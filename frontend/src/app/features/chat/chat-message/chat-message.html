<div
	class="chat-message-row"
	[ngClass]="{
		'user-message': isUser(),
		'assistant-message': isAssistant(),
		'typing-active': showCursor(),
		'bubble-enter': isActiveStream()
	}"
>
	<div class="message-meta">
		<i class="ph role-icon" [class.ph-user]="isUser()" [class.ph-robot]="!isUser()"></i>
		<strong>{{ roleLabel() }}</strong>
	</div>

	@if (isThinkingVisible()) {
	<details
		class="thinking-process-box"
		[class.collapsing-out]="rowState() === 'transitioning'"
		[open]="true"
		(transitionend)="onThinkingTransitionEnd($event)"
	>
		<summary class="thinking-summary">
			<i class="ph summary-icon ph-brain" [class.thinking]="rowState() === 'thinking'"></i>
			<span class="summary-label">&#1508;&#1506;&#1493;&#1500;&#1493;&#1514; &#1513;&#1489;&#1493;&#1510;&#1506;&#1493;...</span>
			<i class="ph ph-caret-down expand-icon"></i>
		</summary>
		<ul class="steps-list">
			@for (step of message().steps; track $index) {
			<li class="step-item">
				<i class="ph {{ step.icon }}"></i>
				<span>{{ step.message }}</span>
			</li>
			}
		</ul>
	</details>
	}

	<div class="message-body" [aiFormat]="contentForDisplay()"></div>
</div>
