<div class="history-preview-wrapper" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
	<div class="dropdown-item rounded">
		<button [routerLink]="['/chat/history']" class="dropdown-link">
			<span class="ph ph-hard-drives"></span>
			<span>היסטוריה</span>
		</button>
	</div>


	<!-- return isOpen() to the condition at end of testing -->
	<!--isOpen()  -->
	@if (isOpen()) {
	<div class="custom-dropdown">
		<div class="dropdown-list glass-effect">
			@for (session of recentSessions(); track session.id) {
			<div class="dropdown-item">
				<button [routerLink]="['/chat']" [queryParams]="{ sessionId: session.id }" class="dropdown-link">
					<span class="ph ph-chat-centered-text dropdown-icon"></span>
					<span class="dropdown-text">{{ displaySessionTitle(session) }}</span>
				</button>
			</div>
			}
		</div>
	</div>
	}
</div>
