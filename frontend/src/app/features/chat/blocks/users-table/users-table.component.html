<div class="users-table-card">
    <div class="card-header">
        <span class="ph ph-users card-icon"></span>
        <span class="card-title">משתמשים</span>
    </div>

    @if (sortedUsers().length === 0) {
        <div class="empty-state">
            <span class="ph ph-user"></span>
            <span>לא נמצאו משתמשים.</span>
        </div>
    } @else {
        <p-table [value]="sortedUsers()" [tableStyle]="{ width: '100%' }" class="users-prime-table">
            <ng-template #header>
                <tr>
                    <th><span class="ph ph-hash"></span></th>
                    <th>שם מלא</th>
                    <th>אימייל</th>
                    <th>תפקיד</th>
                    <th>נוצר בתאריך</th>
                </tr>
            </ng-template>
            <ng-template #body let-user>
                <tr>
                    <td class="cell-id">{{ user.id }}</td>
                    <td>{{ user.fullName }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        @if (user.role != null) {
                            <span class="badge" [class.role-admin]="isAdmin(user.role)" [class.role-user]="!isAdmin(user.role)">
                                {{ getRoleLabel(user.role) }}
                            </span>
                        }
                    </td>
                    <td class="cell-date">{{ formatDate(user.createdAt) }}</td>
                </tr>
            </ng-template>
        </p-table>
    }
</div>
