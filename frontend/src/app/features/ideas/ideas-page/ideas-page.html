<div class="page-content ideas-root">
    <div class="page-scroll">
        @switch (store.pageState()) {
            @case (PageStates.Loading) {
                <app-ideas-progress [phase]="store.phase()" [statusText]="store.statusText()" />
            }
            @case (PageStates.Error) {
                <div class="page-state error-state">
                    <span class="icon ph ph-warning"></span>
                    <h4 class="title">{{ store.error() }}</h4>
                    <button class="primary-btn filled" type="button" (click)="store.generate()">נסה שוב</button>
                </div>
            }
            @case (PageStates.Empty) {
                <div class="page-empty-state">
                    <span class="ph ph-lightbulb xl"></span>
                    <h3>עדיין לא יצרנו רעיונות</h3>
                    <p>הזן תחום עסקי ולחץ "צור רעיונות" כדי להתחיל.</p>
                </div>
            }
            @case (PageStates.Ready) {
                <app-ideas-grid
                    [ideas]="store.ideas()"
                    [partial]="store.partial()"
                    [failedCount]="store.failedCount()"
                    [totalRequested]="store.totalRequested()"
                />
            }
        }
    </div>

    <app-ideas-form />
</div>
