@if (partial()) {
  <div class="badge badge-default ideas-partial-banner">
    <span class="ph ph-warning"></span>
    הוצגו <span dir="ltr">{{ ideas().length }}</span> מתוך
    <span dir="ltr">{{ totalRequested() }}</span> רעיונות (חלק מהרעיונות נכשלו)
  </div>
}

<div class="grid-3">
  @for (idea of ideas(); track $index; let i = $index) {
    <app-idea-card [idea]="idea" [expanded]="expandedIndex() === i" (toggled)="onToggle(i)" />
  }
</div>
