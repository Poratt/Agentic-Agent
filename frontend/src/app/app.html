<svg width="0" height="0" class="gradient-defs-svg">
    <defs>
        <linearGradient id="ringGradientSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--color-success)" />
            <stop offset="100%" stop-color="var(--color-success)" stop-opacity="0.35" />
        </linearGradient>

        <linearGradient id="ringGradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--color-primary)" />
            <stop offset="100%" stop-color="var(--color-primary-glow)" stop-opacity="0.35" />
        </linearGradient>

        <linearGradient id="ringGradientWarning" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--color-warning)" />
            <stop offset="100%" stop-color="var(--color-warning)" stop-opacity="0.35" />
        </linearGradient>

        <linearGradient id="ringGradientDanger" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--color-danger)" />
            <stop offset="100%" stop-color="var(--color-danger)" stop-opacity="0.35" />
        </linearGradient>
    </defs>
</svg>
